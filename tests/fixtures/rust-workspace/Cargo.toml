[workspace]
members = ["crates/*"]
default-members = ["crates/core"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
workspace-core = { path = "crates/core" }

# These profiles do not apply to cargo test.
[profile.release]
debug = true
[profile.bench]
opt-level = 3
