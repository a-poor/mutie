name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TOOLCHAIN: 1.99.1

jobs:
  checks:
    name: Format, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-checks-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-checks-v2-
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit and integration tests
        run: cargo test --locked -- --test-threads=2
      - name: Verify crate packaging
        # Keep packaged sources/binaries out of the checkout's cached build tree.
        run: cargo package --locked --target-dir "$RUNNER_TEMP/mutie-package"

  adapters:
    name: Real ${{ matrix.adapter }} ${{ matrix.suite || 'workflow' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - adapter: Go
          - adapter: Rust
          - adapter: Node
          - adapter: Bun
          - adapter: Vitest
          - adapter: Python
            suite: workflows
          - adapter: Python
            suite: operators
          - adapter: Python
            suite: lifecycle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Rust
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ matrix.adapter }}-${{ matrix.suite }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ matrix.adapter }}-
      - name: Set up Go
        if: matrix.adapter == 'Go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.2
          cache: false
      - name: Set up Node
        if: matrix.adapter == 'Node' || matrix.adapter == 'Vitest'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - name: Set up Bun
        if: matrix.adapter == 'Bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - name: Set up Python
        if: matrix.adapter == 'Python'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.14.7
      - name: Prepare isolated Vitest fixture
        if: matrix.adapter == 'Vitest'
        run: |
          npm install --global --prefix "$RUNNER_TEMP/mutie-tools" --ignore-scripts --no-audit --no-fund pnpm@11.10.0
          export PATH="$RUNNER_TEMP/mutie-tools/bin:$PATH"
          echo "$RUNNER_TEMP/mutie-tools/bin" >> "$GITHUB_PATH"
          cp -R tests/fixtures/vitest "$RUNNER_TEMP/mutie-vitest"
          pnpm --dir "$RUNNER_TEMP/mutie-vitest" install --frozen-lockfile --ignore-scripts
          echo "MUTIE_VITEST_FIXTURE=$RUNNER_TEMP/mutie-vitest" >> "$GITHUB_ENV"
      - name: Prepare isolated pytest environment
        if: matrix.adapter == 'Python'
        run: |
          python -m venv "$RUNNER_TEMP/mutie-python"
          "$RUNNER_TEMP/mutie-python/bin/python" -m pip install --disable-pip-version-check --only-binary=:all: -r benchmarks/fixtures/pytest-audit/requirements.txt
          echo "MUTIE_PYTHON=$RUNNER_TEMP/mutie-python/bin/python" >> "$GITHUB_ENV"
      - name: Go mutation workflows and affected-package selection
        if: matrix.adapter == 'Go'
        run: cargo test --locked --test go_workflow --test affected_packages -- --ignored --test-threads=1
      - name: Go assignment-removal semantics
        if: matrix.adapter == 'Go'
        run: cargo test --locked --bin mutie mutation::assignment::tests::native_assignment_effects -- --ignored --exact
      - name: Go numeric literal semantics
        if: matrix.adapter == 'Go'
        run: cargo test --locked --bin mutie mutation::number::tests::native_ -- --ignored --test-threads=1
      - name: Rust package workflow
        if: matrix.adapter == 'Rust'
        run: cargo test --locked --test rust_workflow rust_fixture_runs_lists_filters_and_saves_results_without_touching_inputs -- --ignored --exact
      - name: Rust workspace workflow
        if: matrix.adapter == 'Rust'
        run: cargo test --locked --test rust_workflow workspace::full_workspace_tests_catch_selected_member_changes_and_preserve_identity -- --ignored --exact
      - name: Rust cancellation and descendant cleanup
        if: matrix.adapter == 'Rust'
        run: cargo test --locked --test rust_workflow rust_mutation_cancellation_preserves_partial_results_and_cleans_processes -- --ignored --exact
      - name: Rust call-removal semantics and scored reruns
        if: matrix.adapter == 'Rust'
        run: |
          cargo test --locked --bin mutie rust::discovery::call_tests::native_ -- --ignored --test-threads=1
          cargo test --locked --test rust_workflow calls:: -- --ignored --test-threads=1
      - name: Rust assignment-removal semantics and scored reruns
        if: matrix.adapter == 'Rust'
        run: |
          cargo test --locked --bin mutie rust::discovery::assignment_tests::native_ -- --ignored --test-threads=1
          cargo test --locked --test rust_workflow assignments:: -- --ignored --test-threads=1
      - name: Rust numeric and string literals with scored reruns
        if: matrix.adapter == 'Rust'
        run: |
          cargo test --locked --bin mutie rust::discovery::number_tests::native_ -- --ignored --test-threads=1
          cargo test --locked --test rust_workflow numbers:: -- --ignored --test-threads=1
          cargo test --locked --bin mutie rust::discovery::string_tests::native_ -- --ignored --test-threads=1
          cargo test --locked --test rust_workflow strings:: -- --ignored --test-threads=1
      - name: Node JS/TS reports, reruns, review and lifecycle failures
        if: matrix.adapter == 'Node'
        run: cargo test --locked --test node_workflow -- --ignored --test-threads=1
      - name: Node timeout, cancellation, capture and isolation
        if: matrix.adapter == 'Node'
        run: cargo test --locked --bin mutie 'node::tests::' -- --ignored --test-threads=1
      - name: Bun JS/TS reports, reruns, review and cleanup
        if: matrix.adapter == 'Bun'
        run: cargo test --locked --test bun_workflow -- --ignored --test-threads=1
      - name: Bun native outcomes and resource limits
        if: matrix.adapter == 'Bun'
        run: cargo test --locked --bin mutie bun::tests::real_ -- --ignored --test-threads=1 --skip real_composer_baseline_and_stronger_finding
      - name: Vitest JS/TS reports, reruns, review and lifecycle failures
        if: matrix.adapter == 'Vitest'
        run: cargo test --locked --test vitest_workflow -- --ignored --test-threads=1
      - name: Vitest native outcomes, lifecycle and cleanup
        if: matrix.adapter == 'Vitest'
        run: cargo test --locked --bin mutie 'vitest::execution::' -- --ignored --test-threads=1 --skip real_feedback_phase_profile
      - name: JS/TS assignment-removal and literal workflows
        if: matrix.adapter == 'Node' || matrix.adapter == 'Bun' || matrix.adapter == 'Vitest'
        env:
          MUTIE_ADAPTER: ${{ matrix.adapter }}
        run: |
          adapter=$(printf '%s' "$MUTIE_ADAPTER" | tr '[:upper:]' '[:lower:]')
          cargo test --locked --test javascript_assignments --test javascript_numbers --test javascript_strings "$adapter" -- --ignored --test-threads=1
      - name: Native Node assignment-removal and literal semantics
        if: matrix.adapter == 'Node'
        run: |
          cargo test --locked --bin mutie javascript::assignment_tests::native_node_assignments -- --ignored --exact
          cargo test --locked --bin mutie javascript::number_tests::native_node_numbers -- --ignored --exact
          cargo test --locked --bin mutie javascript::string_tests::native_node_strings -- --ignored --exact
      - name: Native Bun assignment-removal and literal semantics
        if: matrix.adapter == 'Bun'
        run: |
          cargo test --locked --bin mutie javascript::assignment_tests::native_bun_assignments -- --ignored --exact
          cargo test --locked --bin mutie javascript::number_tests::native_bun_numbers -- --ignored --exact
          cargo test --locked --bin mutie javascript::string_tests::native_bun_strings -- --ignored --exact
      # These complementary filters partition python_workflow; keep them in sync.
      - name: Python reports, reruns, review and cleanup
        if: matrix.suite == 'workflows'
        run: >-
          cargo test --locked --test python_workflow -- --ignored --test-threads=1
          --skip arithmetic_ --skip assignments_ --skip branch --skip calls_ --skip comparison_ --skip inversions_
          --skip logical_ --skip loop --skip modulo_ --skip numbers_ --skip strings_
      - name: Python operator workflows and native semantics
        if: matrix.suite == 'operators'
        run: >-
          cargo test --locked --test python_workflow -- --ignored --test-threads=1
          arithmetic_ assignments_ branch calls_ comparison_ inversions_ logical_ loop modulo_ numbers_ strings_
      - name: Python native lifecycle, capture and descendant cleanup
        if: matrix.suite == 'lifecycle'
        run: cargo test --locked --bin mutie python::tests::native_ -- --ignored --test-threads=1
