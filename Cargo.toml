[package]
name = "mutie"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
globset = "0.4.20"
reflink-copy = "0.1.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"
