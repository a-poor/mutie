[package]
name = "mutie"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
globset = "0.4.20"
# Writer access batches each frame with its cursor anchor; keep the API pinned.
ratatui = { version = "=0.30.1", default-features = false, features = ["crossterm_0_29", "unstable-backend-writer"] }
reflink-copy = "0.1.30"
roxmltree = "=0.21.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.6"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tree-sitter = "0.27.0"
tree-sitter-go = "0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-javascript = "=0.25.0"
tree-sitter-typescript = "=0.23.2"
serde_yaml_ng = "0.10.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
vt100 = "0.16.2"

# Full executable fingerprints dominate Bun feedback in unoptimized builds.
# Keep byte verification intact while making development/test hashing practical.
[profile.dev.package.sha2]
opt-level = 3
